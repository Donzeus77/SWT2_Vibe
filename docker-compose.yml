services:
  postgres-simulator:
    image: postgres:16
    container_name: postgres-simulator
    environment:
      POSTGRES_DB: simulator_db
      POSTGRES_USER: mensa
      POSTGRES_PASSWORD: mensa123
    ports:
      - "5433:5432"
    volumes:
      - pgdata-simulator:/var/lib/postgresql/data

  postgres-app:
    image: postgres:16
    container_name: postgres-app
    environment:
      POSTGRES_DB: mensa_db
      POSTGRES_USER: mensa
      POSTGRES_PASSWORD: mensa123
    ports:
      - "5434:5432"
    volumes:
      - pgdata-app:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  pgdata-simulator:
  pgdata-app:
